# docker compose up -d --build     -> http://localhost:8000
# More gateways: they are stateless — add replicas behind a reverse proxy (drop the host port mapping)
# History (5 years):     open the ADMIN desk (F9) and press Start pull — or, from a script:
# One-off jobs:          docker compose run --rm tools python /app/backfill/backfill.py plan --intervals D,1 --years 5
#                        docker compose run --rm tools python /app/research/evaluate_intraday.py

x-app: &app
  build: .
  image: tradedesk:latest
  env_file:
    - path: .env
      required: false
  environment:
    REDIS_URL: redis://redis:6379/0
    DATA_DIR: /app/data
  volumes:
    - ./data:/app/data
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # the ONLY process that talks to Dhan (one websocket set, one token, one rate budget)
  ingestor:
    <<: *app
    command: ["python", "-m", "td.services.ingestor"]

  # ranking, option analytics, swing scanner, alerts, scorecard
  analytics:
    <<: *app
    command: ["python", "-m", "td.services.analytics"]

  # GEO desk: ships, chokepoints, conflict, fires, aircraft, geo-risk, macro (free public feeds)
  geo:
    <<: *app
    command: ["python", "-m", "td.services.geo"]

  # history pulls for the ADMIN desk (F9): its own container, paced around the live services and resumed after a
  # redeploy (job + progress live in ./data/backfill). Stopping it never affects the live desks.
  backfill:
    <<: *app
    command: ["python", "-m", "td.services.backfiller"]

  # stateless fan-out to browsers; scale it as wide as you like
  gateway:
    <<: *app
    command: ["python", "-m", "uvicorn", "td.services.gateway:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${GATEWAY_PORT:-8000}:8000"

  # not started by default: `docker compose run --rm tools <command>`
  tools:
    <<: *app
    profiles: ["tools"]
    restart: "no"
    command: ["python", "/app/backfill/backfill.py", "status"]
